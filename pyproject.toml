[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "landsat-timeseries"
version = "0.1.0"
description = "Multi-year Landsat composites for an AOI, read straight from the Planetary Computer STAC API."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "siancfd" }]
keywords = ["landsat", "remote-sensing", "stac", "planetary-computer", "geospatial", "time-series"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy",
    "rasterio>=1.3",
    "geopandas>=0.14",
    "shapely>=2.0",
    "pystac-client>=0.7",
    "planetary-computer>=1.0",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
landsat-timeseries = "landsat_timeseries.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
